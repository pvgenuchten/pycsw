default:
  interruptible: false
stages:
  - build

# build a new container
build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  when: on_success
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$HARBOR_REGISTRY\":{\"username\":\"$HARBOR_USER\",\"password\":\"$HARBOR_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - echo "build; $CI_COMMIT_REF_NAME:$CI_COMMIT_TAG@$CI_COMMIT_SHORT_SHA"
    - if [ -z $CI_COMMIT_TAG ]; then /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $HARBOR_REGISTRY/$HARBOR_PROJECT/pycsw-soilwise:latest --destination $HARBOR_REGISTRY/$HARBOR_PROJECT/pycsw-soilwise:$CI_COMMIT_SHORT_SHA; else /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $HARBOR_REGISTRY/$HARBOR_PROJECT/pycsw-soilwise:$CI_COMMIT_TAG --destination $HARBOR_REGISTRY/$HARBOR_PROJECT/pycsw-soilwise:latest; fi
  only:
    - tags


